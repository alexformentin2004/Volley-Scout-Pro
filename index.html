rom)}"></label><label>Al<input type="date" data-stat="to" value="${esc(statTo)}"></label></div>`;return head('Performance Center','Statistiche reali · '+statMatches().length+' partite')+card('Filtri',filters)+`<div class="grid">${kpi.map(([n,v])=>VSPDesign.metric(n,v)).join('')}</div>`+card('Andamento delle ultime 12 partite',VSPDesign.trend(r.trend||[]))+card('Copertura',`<p>${f.reduce((n,x)=>n+x.detailed,0)} azioni dettagliate · ${f.reduce((n,x)=>n+x.quick,0)} Quick. Le percentuali tecniche usano solo valutazioni dettagliate. Le partite da rosa usano ID stabili; quelle precedenti mantengono nome/numero. I confronti per ID stabile aggregano anche trasferimenti; SO/BP e risultati di gara rimangono della squadra propria. Campioni piccoli: interpretare con cautela.</p>`)+card('Rotazioni · squadra propria',r.rotations.map(x=>`<div style="margin:12px 0"><strong>P${x.rotation}</strong> · SO ${VSPStats.pct(VSPStats.ratio(x.so,x.receive))} (${x.so}/${x.receive}) · BP ${VSPStats.pct(VSPStats.ratio(x.bp,x.serve))} (${x.bp}/${x.serve})<div style="height:8px;background:var(--line);margin:5px 0"><div style="height:100%;background:#375dfb;width:${VSPStats.ratio(x.so,x.receive)||0}%"></div></div><div style="height:8px;background:var(--line)"><div style="height:100%;background:#16865c;width:${VSPStats.ratio(x.bp,x.serve)||0}%"></div></div></div>`).join(''))+card('Mappe destinazione · Expert',r.heatmaps.map(h=>`<h3>${h.fund} · ${h.zones.reduce((a,b)=>a+b,0)} zone rilevate</h3><div class="court">${[4,3,2,5,6,1].map(z=>`<div class="zone" style="background:rgba(55,93,251,${.08+.7*h.zones[z-1]/Math.max(1,...h.zones)})"><small>Zona ${z}</small><b>${h.zones[z-1]}</b></div>`).join('')}</div>`).join(''))+sections.slice(1).filter(([n])=>n!=='Azioni').map(([n,rows])=>card(n,statTable(rows))).join('')+card('Esportazioni',btn('CSV','statscsv','','primary')+' '+btn('Excel XLSX','statsxlsx')+' '+btn('PDF nativo','statsprint'))}

let vmId='',vf={player:'',fund:'',quality:'',set:'',rotation:''},videoURL='',videoFile=null,videoDuration=Infinity,videoPos=0,videoRate=1,videoPlaying=false,clipEnd=null,selectedAction='',videoNote='';

>${all.map(a=>`<option value="${esc(a.id)}" ${a.id===selectedAction?'selected':''}>${esc('S'+a.set+' · R'+a.rally+' · '+a.fund+' '+a.quality+' · '+(playerLabel(m,a.player)||'—'))}</option>`).join('')}</select></label>${btn('Aggiungi riferimento','vanchor','','primary')} ${btn('Collega solo questa azione','vlink')} ${btn('Rimuovi riferimenti','vclear')}<p>${d.anchors.length} riferimenti · ${Object.keys(d.links).length} collegamenti manuali</p>`)+card('Timeline e ricerca',`<div class="setupgrid">${[['player','Atleta',[...new Set(all.map(a=>a.player).filter(Boolean))]],['fund','Fondamentale',funds],['quality','Valutazione',['#','+','!','/','−','=']],['set','Set',[1,2,3,4,5]],['rotation','Rotazione',[1,2,3,4,5,6]]].map(([k,n,v])=>`<label>${n}<select data-vfilter="${k}"><option value="">Tutti</option>${k==='player'?v.map(id=>`<option value="${esc(id)}" ${vf[k]===id?'selected':''}>${esc(playerLabel(m,id)||id)}</option>`).join(''):options(v,vf[k])}</select></label>`).join('')}</div><p>${acts.length} azioni · ${acts.filter(a=>videoTime(a,m)!==null).length} con riferimento temporale</p><div style="max-height:420px;overflow:auto">${acts.map(a=>{const t=videoTime(a,m);return `<div class="item"><div><strong>${esc(a.fund+' '+a.quality+' · '+(playerLabel(m,a.player)||'—'))}</strong><p>Set ${a.set} · Scambio ${a.rally} · ${t===null?'Non collegata':t.toFixed(1)+' s'}</p></div><div>${t===null?'':btn('Guarda','vplay',a.id)+' '+btn('+ Playlist','vadd',a.id)} ${btn('Nota','vnote',a.id)}<p>${esc(d.notes[a.id]||'')}</p></div></div>`}).join('')||'Nessuna azione'}</div>`)+card('Playlist',d.playlist.filter(id=>all.some(a=>a.id===id)).map(id=>{let a=all.find(x=>x.id===id);return `<div class="item">${esc(a.fund+' '+a.quality+' · '+(playerLabel(m,a.player)||'—'))}<div>${videoTime(a,m)===null?'Non collegata':btn('Guarda','vplay',id)} ${btn('↑','vup',id)} ${btn('↓','vdown',id)} ${btn('Rimuovi','vremove',id)}</div></div>`}).join('')+btn('Esporta playlist JSON','vexport'))}
function intelligenceResult(){const r=statResult(),selected=statMatches(),prior=VSPIntelligence.historical(records,selected,r.filter);return {prior,a:VSPIntelligence.analyze(r,prior.length?VSPPerformance.analyze(prior,r.filter):null)}}
function insightPage(){const {a,prior}=intelligenceResult();return head('Volley Intelligence','Assistente tecnico deterministico · locale')+card('Contesto',`<p>Filtri del Performance Center · ${statMatches().length} partite · ${prior.length} precedenti concluse comparabili.</p><p>${a.coverage.detailed} dettagliate · ${a.coverage.quick} Quick escluse dalle percentuali. Soglie operative: 10 e 30 tentativi; intervalli Wilson indicativi, non garanzia di indipendenza.</p>${btn('Modifica filtri','statsopen')} ${btn('Esporta analisi TXT','iexport')}`)+card('Indicatori e campioni',statTable([['Fondamentale','Tentativi','Successo','Intervallo indicativo 95%','Campione','Differenza storico (p.p.)'],...a.metrics.map(m=>[m.fund,m.n,VSPStats.pct(m.value),m.interval?m.interval.map(VSPStats.pct).join(' – '):'—',m.confidence,m.delta===null?'—':m.delta.toFixed(1)])]))+card('Osservazioni e allenamento',a.observations.map(o=>`<div class="item"><div><strong>${esc(o.kind+' · '+o.fund)}</strong><p>${esc(o.text)}</p><p>${esc(o.drill)}</p>${o.examples.map(e=>btn(esc(e.label),'ivideo',JSON.stringify([e.matchId,e.id]))).join(' ')}</div></div>`).join('')||'Nessuna osservazione supera le soglie operative. Non equivale a prestazione ottimale.')+card('Rotazioni proprie',statTable([['Rotazione','Scambi in ricezione','Side-out'],...a.rotations.map(x=>['P'+x.rotation,x.n,VSPStats.pct(x.value)])])+ '<p>Solo rotazioni con almeno 10 scambi. Non filtrate per atleta.</p>')+card('Atleti',statTable([['Atleta','Attacchi','Efficienza','Campione','Ricezioni','Positiva','Campione'],...a.athletes.map(x=>[x.name,x.attempts,VSPStats.pct(x.eff),x.attackNote,x.receptions,VSPStats.pct(x.reception),x.receptionNote])]))+card('Limiti','Le osservazioni sono descrittive, non diagnosi tattiche. Controllare copertura, avversari e filmati. Nessun modello generativo.');}
function captureVideo(){let v=$('#vspVideo');if(v){videoPos=v.currentTime||0;videoRate=v.playbackRate;videoPlaying=!v.paused;v.pause()}}
function restoreVideo(){let v=$('#vspVideo');if(!v)return;v.onloadedmetadata=()=>{videoDuration=v.duration;const scrub=$('#vscrub');if(scrub&&Number.isFinite(v.duration)){scrub.max=v.duration;scrub.value=videoPos}v.currentTime=Math.min(videoPos,v.duration);v.playbackRate=videoRate;if(videoPlaying)v.play().catch(()=>{});};v.ontimeupdate=()=>{const scrub=$('#vscrub'),clock=$('#vclock');if(scrub)scrub.value=v.currentTime;if(clock)clock.textContent=v.currentTime.toFixed(1)+' s';if(clipEnd!==null&&v.currentTime>=clipEnd){v.pause();clipEnd=null}};v.onerror=()=>{videoNote='Filmato non riproducibile: verificare codec e formato.';};}
async function updateVideo(m,d){await commit(records.map(x=>x.id===m.id?{...x,video8:d}:x),active)}
async function videoCommand(c,id){const m=vm(),d=structuredClone(videoData(m)),v=$('#vspVideo'),a=VSPVideo.actions(m).find(x=>x.id===(id||selectedAction));if(c==='vrefresh')return;if(c==='vprev'||c==='vnext'){if(!videoURL||!Number.isFinite(v.duration))throw Error('Selezionare il filmato');const row=VSPStudio.neighbor(VSPStudio.timeline(VSPVideo.actions(m,vf),d,v.duration),v.currentTime,c==='vnext'?1:-1);if(row){clipEnd=null;v.currentTime=row.time}return}if(c==='vseek'){if(!videoURL||!Number.isFinite(v.duration))throw Error('Selezionare il filmato');clipEnd=null;v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+Number(id)));return}if(c==='vplay'){if(!videoURL||!a||!Number.isFinite(v.duration))throw Error('Selezionare il filmato');const t=videoTime(a,m);if(t===null)throw Error('Azione non collegata');const clip=VSPVideo.clip(t,v.duration,d.before,d.after);clipEnd=clip.end;v.currentTime=clip.start;await v.play();return}if(c==='vexport'){statsDownload(JSON.stringify({matchId:m.id,...d},null,2),'application/json','vsp-playlist.json');return}if(c==='vwindow'){d.before=Number($('#vbefore').value);d.after=Number($('#vafter').value);VSPStudio.validate(d)}else if(c==='vnote'){if(!a)throw Error('Azione non valida');const n=prompt('Nota tecnica (max 2000 caratteri)',d.notes[id]||'');if(n===null)return;if(n.length>2000)throw Error('Nota troppo lunga');if(n.trim())d.notes[id]=n;else delete d.notes[id]}else if(c==='vclean'){if(!confirm('Eliminare i riferimenti alle azioni non più presenti?'))return;Object.assign(d,VSPStudio.clean(VSPVideo.actions(m),d))}else if(c==='vup'||c==='vdown'){d.playlist=VSPStudio.move(d.playlist,id,c==='vup'?-1:1)}else if(c==='vanchor'||c==='vlink'){if(!videoURL||!a||!Number.isFinite(v.duration))throw Error('Selezionare filmato e azione');if(c==='vanchor'){const t=Date.parse(a.at);d.anchors=VSPVideo.anchors([...d.anchors.filter(x=>x.event!==t),{event:t,video:v.currentTime}])}else d.links[a.id]=v.currentTime}else if(c==='vclear'){d.anchors=[];d.links={}}else if(c==='vadd'){if(!a)throw Error('Azione non valida');if(!d.playlist.includes(id))d.playlist.push(id)}else if(c==='vremove')d.playlist=d.playlist.filter(x=>x!==id);await updateVideo(m,d)}
document.addEventListener('change',e=>{const t=e.target;if(t.id==='vm'){captureVideo();if(videoURL)URL.revokeObjectURL(videoURL);videoURL='';videoFile=null;videoPos=0;videoDuration=Infinity;videoPlaying=false;clipEnd=null;selectedAction='';vmId=t.value;vf={player:'',fund:'',quality:'',set:'',rotation:''};videoNote='';render()}else if(t.id==='va')selectedAction=t.value;else if(t.id==='vrate'){videoRate=+t.value;$('#vspVideo').playbackRate=videoRate}else if(t.dataset.vfilter){captureVideo();vf[t.dataset.vfilter]=t.value;render()}else if(t.id==='videoFile'&&t.files[0]){const f=t.files[0],m=vm(),d=structuredClone(videoData(m));const meta={name:f.name,size:f.size,lastModified:f.lastModified};if(d.file&&JSON.stringify(d.file)!==JSON.stringify(meta)&&!confirm('Filmato differente: azzerare riferimenti e playlist?'))return;if(d.file&&JSON.stringify(d.file)!==JSON.stringify(meta)){d.anchors=[];d.links={};d.playlist=[];d.notes={}}d.file=meta;run(async()=>{await updateVideo(m,d);if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);videoFile=f;videoPos=0;videoDuration=Infinity;videoPlaying=false;clipEnd=null;videoNote='Filmato selezionato: '+f.name})}});

function b11MatchList(){return [...records].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).filter(m=>{const t=VSP.reduce(m);return (m.home+' '+m.away+' '+(m.preparation?.competition||'')).toLowerCase().includes(beta11ArchiveQuery.toLowerCase())&&(beta11ArchiveFilter==='all'||(beta11ArchiveFilter==='progress'?!t.finished:t.finished&&(beta11ArchiveFilter==='win'?t.sets[0]>t.sets[1]:t.sets[0]<t.sets[1])))}).map(b11Tile).join('')||'<p class="muted">Nessuna partita trovata.</p>'}
function b11Settings(){const items=[['Aspetto','Tema chiaro e scuro'],['Preferenze scouting','Modalità predefinita'],['Dati e backup','Importazione e recupero'],['Informazioni','Versione e installazione']];if(beta11Settings==='main')return head('Impostazioni','Preferenze e archivio locale')+items.map(([n,d])=>`<button class="matchtile" data-b11="setting" data-id="${n}"><strong>${n}</strong><p class="muted">${d}</p></button>`).join('');const t=beta11Settings;return head(t,'Impostazioni')+`<button data-b11="setting" data-id="main">← Impostazioni</button>`+(t==='Aspetto'?card('Tema',`<div class="tabrow">${['light','dark','system'].map((v,i)=>`<button data-b11="theme" data-id="${v}">${['Chiaro','Scuro','Sistema'][i]}</button>`).join('')}</div>`):t==='Preferenze scouting'?card('Modalità predefinita',`<div class="tabrow"><button data-b11="defaultmode" data-id="Advanced">Rapida</button><button data-b11="defaultmode" data-id="Expert">Avanzata</button></div><p class="muted">Modalità attuale: ${mode==='Expert'?'Avanzata':'Rapida'}</p>`):t==='Dati e backup'?localBackup()+card('Archivio locale',btn('Richiedi storage persistente','persist')):card('Volley Scout Pro · Beta 1.1','<p>Archivio locale · Nessun account o cloud.</p><p>Su iPad e iPhone: Safari → Condividi → Aggiungi alla schermata Home.</p><p id="pwaStatus" role="status">'+esc(VSPPWA.status())+'</p><button id="pwaInstall" hidden>Installa app</button> <button id="pwaUpdate" hidden>Applica aggiornamento</button>'))}
function b11PostStats(root){const old=[...root.querySelectorAll(':scope > .card')],filters=old[0],grid=root.querySelector(':scope > .grid');if(!filters||!grid)return;const first=root.querySelector('.head');if(first)first.innerHTML='<h1>Statistiche</h1><p class="muted">Analisi delle prestazioni</p>';let tab=document.createElement('div');tab.className='tabrow';tab.innerHTML=['Riepilogo','Atleti','Fondamentali','Rotazioni'].map(x=>`<button data-b11="tab" data-id="${x}" class="${beta11Tab===x?'selected':''}">${x}</button>`).join('');filters.before(tab);const f=document.createElement('details');f.innerHTML='<summary>Partita, stagione e filtri</summary>';filters.before(f);f.append(filters);f.open=beta11Details.has('Partita, stagione e filtri');const group=c=>{const n=c.querySelector('h2')?.textContent||'';if(/Esportazioni/.test(n))return 'all';if(/Rotazion|Side.out|Break.point/i.test(n))return 'Rotazioni';if(/Atlet|Giocator|Individual|Confront/i.test(n))return 'Atleti';if(/Fondamental|Mappe|Distribuz|Valutaz/i.test(n))return 'Fondamentali';return 'Riepilogo'};grid.hidden=beta11Tab!=='Riepilogo';for(const c of old.slice(1)){const g=group(c);c.hidden=g!=='all'&&g!==beta11Tab}const exporter=old.find(c=>group(c)==='all');if(exporter){let d=document.createElement('details');d.innerHTML='<summary>Esporta statistiche</summary>';exporter.before(d);d.append(exporter);d.insertAdjacentHTML('beforeend',`<div class="row">${b11Link('Report Studio','Opzioni esportazione')} ${match()?`<button data-b11="exportmatch" data-id="${esc(match().id)}">JSON partita</button>`:''}</div>`);d.open=beta11Details.has('Esporta statistiche')}if(beta11Tab==='Riepilogo'&&statMatches().length){const a=intelligenceResult().a;const h=card('Osservazioni sulla partita',a.observations.map(o=>`<p><strong>${esc(o.kind+' · '+o.fund)}</strong><br>${esc(o.text)}</p>`).join('')||'<p class="muted">Dati insufficienti per osservazioni affidabili.</p>');grid.insertAdjacentHTML('afterend',b11Wrap('Osservazioni tecniche',h,beta11Details.has('Osservazioni tecniche')))}}
function b11Wizard(root){for(const form of root.querySelectorAll('#setup,#rosterSetup')){const reg=form.id==='rosterSetup',children=[...form.children],groups=[[],[],[]];let g=0;for(const node of children){const text=node.textContent.trim(),name=node.querySelector('[name]')?.name;if(reg){if(node.tagName==='H3'&&text==='Convocati')g=1;if(node.tagName==='H3'&&text.startsWith('Campo'))g=2}else if(node.classList.contains('setupgrid'))g=2;if(!reg&&node.tagName==='BUTTON')g=2;groups[g].push(node)}const actual=reg?beta11SetupStep:beta11SetupStep===1?2:beta11SetupStep;const progress=document.createElement('div');progress.className='wizard-progress';progress.innerHTML=['Partita','Convocazioni','Formazione'].map((n,i)=>`<span class="${i===actual?'on':''}">${n}</span>`).join('');form.prepend(progress);for(let i=0;i<3;i++)for(const n of groups[i])n.classList.toggle('hidden-step',i!==actual);const foot=document.createElement('div');foot.className='wizard-footer';foot.innerHTML=`${actual>0?`<button type="button" data-b11="wizard" data-id="${reg?actual-1:0}">Indietro</button>`:''}${actual<2?`<button type="button" class="primary" data-b11="wizard" data-id="${reg?actual+1:2}">Continua →</button>`:''}`;form.append(foot);form.addEventListener('submit',e=>{if(!form.checkValidity()){e.preventDefault();form.reportValidity()}},true)} }
render=function(){const activeLive=current==='Scout Live'&&state()&&!state().finished;liveFocus=!!activeLive;beta11OriginalRender();const root=$('#main');$('#nav').innerHTML=b11Nav.map((p,i)=>VSPDesign.nav(p,current,['Home','Scout','Statistiche','Archivio','Altro'][i])).join('');$('#mobile').innerHTML=$('#nav').innerHTML;const replace=h=>{const err=root.querySelector('[role=alert]');root.innerHTML=(err?err.outerHTML:'')+h};if(current==='Archivio')replace(b11Archive());else if(current==='Altro')replace(head('Altro','Gestione e preferenze')+card('Gestione',`<div class="tabrow">${b11Link('Squadre','Squadre e atleti')}${b11Link('Impostazioni','Impostazioni')}</div>`));else if(current==='Impostazioni')replace(b11Settings());else if(current==='Statistiche')b11PostStats(root);else if(current==='Scout Live'&&!match())b11Wizard(root);else if(current==='Squadre'){const h=root.querySelector('h1');if(h)h.textContent='Squadre e atleti';const g=root.querySelector('.grid');if(g){for(const c of [...g.children]){const title=c.querySelector('h2')?.textContent||'Gestione';const d=document.createElement('details');d.innerHTML='<summary>'+esc(title)+'</summary>';c.before(d);d.append(c);d.open=beta11Details.has(title)}}}else if(current==='Videoanalisi'){const h=root.querySelector('h1');if(h)h.textContent='Analisi video';for(const c of [...root.querySelectorAll(':scope > .card')]){const t=c.querySelector('h2')?.textContent||'';if(['Controlli avanzati','Sincronizzazione','Playlist'].includes(t)){const d=document.createElement('details');d.innerHTML='<summary>'+esc(t)+'</summary>';c.before(d);d.append(c);d.open=beta11Details.has(t)}}}else if(current==='Report Studio'){const h=root.querySelector('h1');if(h)h.textContent='Opzioni esportazione'}for(const d of root.querySelectorAll('details')){const t=d.querySelector('summary')?.textContent;if(t&&beta11Details.has(t))d.open=true;d.addEventListener('toggle',()=>{if(t){if(d.open)beta11Details.add(t);else beta11Details.delete(t)}})}VSPResponsive.enhance(root);VSPPWA.paint()};
function b11Theme(v){try{localStorage.setItem('vsp-theme',v)}catch{}document.body.classList.toggle('dark',v==='dark'||(v==='system'&&matchMedia('(prefers-color-scheme:dark)').matches))}
try{b11Theme(localStorage.getItem('vsp-theme')||'system');mode=localStorage.getItem('vsp-defaultmode')==='Expert'?'Expert':'Advanced'}catch{}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-b11]');if(!b||busy)return;const k=b.dataset.b11,id=b.dataset.id;if(k==='wizard'){const form=b.closest('form');if(+id>beta11SetupStep){for(const n of form.querySelectorAll('input,select'))if(!n.closest('.hidden-step')&&!n.checkValidity()){n.reportValidity();return}}beta11SetupStep=+id;for(const n of form.querySelectorAll('.wizard-progress,.wizard-footer'))n.remove();for(const n of form.children)n.classList.remove('hidden-step');b11Wizard($('#main'));return}if(k==='detail'){beta11Detail=id;current='Archivio'}else if(k==='back'){beta11Detail=null;current='Archivio'}else if(k==='importhome'){beta11Detail=null;current='Archivio';render();$('#localImport')?.click();return}else if(k==='tab')beta11Tab=id;else if(k==='setting')beta11Settings=id;else if(k==='theme')b11Theme(id);else if(k==='defaultmode'){mode=id;try{localStorage.setItem('vsp-defaultmode',id)}catch{}}else if(k==='exportmatch'){const m=records.find(x=>x.id===id);if(m)statsDownload(JSON.stringify({version:25,records:[m],active:null,directory},null,2),'application/json','vsp-partita.json');return}else if(k==='stats'){run(async()=>{await commit(records,id);statScope='match';statSet='';statPlayer='';statTeam='';statSeason='';statCompetition='';statFrom='';statTo='';statFinished=false;current='Statistiche'});return}else if(k==='video'){if(videoURL)URL.revokeObjectURL(videoURL);videoURL='';videoFile=null;videoPos=0;vmId=id;current='Videoanalisi'}render();window.scrollTo(0,0)});
document.addEventListener('input',e=>{if(e.target.id==='b11Search'){beta11ArchiveQuery=e.target.value;$('#b11Matches').innerHTML=b11MatchList()}});document.addEventListener('change',e=>{if(e.target.id==='b11Result'){beta11ArchiveFilter=e.target.value;$('#b11Matches').innerHTML=b11MatchList()}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.page==='Archivio')beta11Detail=null;if(b?.dataset.cmd==='new')beta11SetupStep=0},true);

VSPPWA.setup();document.addEventListener('click',()=>queueMicrotask(VSPPWA.paint));
</script>
